# Every repeatable command of this repository, so documentation names a task and never a
# raw command (docs-and-taskfile skill). `task --list` shows them.
version: '3'

vars:
  BINARY: rein
  PACKAGE: ./cmd/rein

tasks:
  rein:build:
    desc: Build rein into .tmp/rein for a local try without installing it
    cmds:
      - mkdir -p .tmp
      - go build -o .tmp/{{.BINARY}} {{.PACKAGE}}

  rein:install:
    desc: Install rein into the Go bin folder (go env GOPATH)/bin and check that the shell finds this copy
    cmds:
      - go install {{.PACKAGE}}
      - cmd: |
          installed="$(go env GOPATH)/bin/{{.BINARY}}"
          found="$(command -v {{.BINARY}} 2>/dev/null || true)"
          if [ -z "$found" ]; then
            echo "installed to $installed, which is not on your PATH:"
            echo "  echo 'export PATH=\"$(go env GOPATH)/bin:\$PATH\"' >> ~/.zshrc && source ~/.zshrc"
            exit 1
          fi
          if [ "$found" != "$installed" ]; then
            echo "installed to $installed, but your shell runs $found first;"
            echo "remove that copy or put $(go env GOPATH)/bin earlier on your PATH"
            exit 1
          fi
          {{.BINARY}} version
        silent: true

  rein:test:
    desc: Vet and test every package; the gate before every handover
    cmds:
      - go vet ./...
      - go test ./...

  rein:test-keychain:
    desc: Round-trip a token and a key through this machine's real keychain; writes a test entry and removes it, so run it on purpose
    cmds:
      - go test -tags keychain -count=1 -run TestSystemKeychain ./internal/adapters/keychain

  rein:coverage:
    desc: Test every package with statement coverage, print the summary, and leave the HTML report in .tmp/coverage.html
    cmds:
      - mkdir -p .tmp
      - go test -coverprofile=.tmp/coverage.out ./...
      - go tool cover -func=.tmp/coverage.out | tail -1
      - go tool cover -html=.tmp/coverage.out -o .tmp/coverage.html
      - 'echo "per file: go tool cover -func=.tmp/coverage.out; in the browser: open .tmp/coverage.html"'

  rein:release-check:
    desc: Validate the GoReleaser configuration without releasing anything
    cmds:
      - GOFLAGS=-mod=mod go run github.com/goreleaser/goreleaser/v2@v2.19.0 check

  rein:release:
    desc: "Cut and publish the next version from this machine with reinctl: gate, changelog, commit, tag, push, build, GitHub Release; the human runs this"
    cmds:
      - go run ./cmd/reinctl release

  rein:publish:
    desc: Build every platform and publish the GitHub Release for the tag at HEAD, for a release whose publish failed
    cmds:
      - go run ./cmd/reinctl publish

  rein:lint:
    desc: Run rein lint on this repository
    deps: [rein:build]
    cmds:
      - .tmp/{{.BINARY}} lint .

  rein:check:
    desc: Format check, vet, tests and lint in one go
    cmds:
      - cmd: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
        silent: true
      - task: rein:test
      - task: rein:lint
