# The gate on every push to main and every pull request: the whole gate on Linux, vet and
# tests on macOS and Windows, the other platforms a release builds for. It only checks;
# a release is cut from the developer's machine (docs/developing.md).
name: check

on:
  push:
    branches: [main]
    # the release commit changes only CHANGELOG.md, and reinctl release cut it
    # from a commit this workflow had passed on
    paths-ignore: [CHANGELOG.md]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - run: task rein:check
      - run: task rein:release-check
      # a runner has no desktop, so GNOME Keyring is started and unlocked in a session of its own
      - name: keychain round trip (GNOME Keyring through secret-tool)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-tools dbus
          dbus-run-session -- sh -c 'echo rein | gnome-keyring-daemon --unlock --components=secrets && task rein:test-keychain'
        env:
          REIN_KEYCHAIN_REQUIRED: "1"

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - run: task rein:test
      - name: keychain round trip (the login keychain or Credential Manager)
        run: task rein:test-keychain
        env:
          REIN_KEYCHAIN_REQUIRED: "1"
